name: Update profile metrics

# Regenerates github-metrics.svg (stats + top languages) and commits it.
# The README tool/fork tables and their star badges are owned by
# update-tools.yml + .github/scripts/gen_tools.py.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

# Shared with update-tools.yml so the two workflows never push to main at once.
concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Generate and commit github-metrics.svg. metrics handles its own commit.
      # Works with the default GITHUB_TOKEN for public data; add a repo secret
      # named METRICS_TOKEN (a PAT) to also include private-repo contributions.
      - name: Generate metrics SVG
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          filename: github-metrics.svg
          output_action: commit
          config_timezone: Africa/Cairo
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
